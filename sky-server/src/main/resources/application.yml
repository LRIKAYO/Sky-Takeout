server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  redis:
    host: ${SKY_REDIS_HOST:127.0.0.1}
    port: ${SKY_REDIS_PORT:6379}
    username: ${SKY_REDIS_USERNAME:root}
    password: ${SKY_REDIS_PASSWORD}
    database: ${SKY_REDIS_DATABASE:10}
    connect-timeout: 3s
    timeout: 3s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

  upload:
    # 学习环境先使用本地存储；接回阿里云时设置 SKY_UPLOAD_MODE=oss
    mode: ${SKY_UPLOAD_MODE:local}
    local-dir: ${SKY_UPLOAD_LOCAL_DIR:./uploads}
    base-url: ${SKY_UPLOAD_BASE_URL:http://localhost:8080/uploads}

  alioss:
    endpoint: ${SKY_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    region: ${SKY_OSS_REGION:cn-hangzhou}
    access-key-id: ${SKY_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${SKY_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${SKY_OSS_BUCKET_NAME:}
    domain: ${SKY_OSS_DOMAIN:}
